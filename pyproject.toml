[project]
name = "translation-agent-backend"
version = "0.1.0"
description = "FastAPI Room creation and management backend for LiveKit Realtime Translation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "livekit-api>=0.2.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "cachetools>=7.2.4",
    "python-multipart>=0.0.9",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.1",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "panphon>=0.20.0",
    "espeakng-loader>=0.2.4",
    "phonemizer-fork>=3.3.0",
    "python-Levenshtein>=0.21.0",
    "sentencepiece>=0.1.99",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
